<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skee-Ball · Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../arcade.css" />
</head>
<body class="arcade">
  <button id="music-toggle" aria-label="Toggle arcade music">&#9834; MUSIC OFF</button>

  <main class="table">
    <h1 class="title">Skee-<span>Ball</span></h1>

    <nav class="game-nav" aria-label="Games">
      <a href="../arcade.html">Arcade</a>
      <a href="../index.html">Blackjack</a>
      <a href="../roulette.html">Roulette</a>
    </nav>

    <div class="back-row">
      <a href="../arcade.html" class="btn ghost">← Back to Arcade</a>
    </div>

    <p id="message" class="message" aria-live="polite">Launch the ball into the high-scoring rings</p>

    <section class="canvas-frame">
      <canvas id="game" width="640" height="420" role="img" aria-label="Skee-ball lane"></canvas>
    </section>

    <div class="stats">
      <div>Bet <strong id="bet">$10</strong></div>
      <div class="divider" aria-hidden="true"></div>
      <div>Bankroll <strong id="bankroll">$1,000</strong></div>
    </div>

    <section class="controls">
      <div class="panel">
        <button class="chip-btn" data-chip="5">5</button>
        <button class="chip-btn" data-chip="25">25</button>
        <button class="chip-btn" data-chip="100">100</button>
      </div>
      <div class="panel">
        <button id="roll" class="btn primary">Roll</button>
      </div>
    </section>

    <table class="paytable" aria-label="Ring values">
      <thead><tr><th>Ring</th><th>Points</th><th>Payout</th></tr></thead>
      <tbody>
        <tr><td>Center (50)</td><td class="pay">50</td><td class="pay">5&times;</td></tr>
        <tr><td>2nd (30)</td><td class="pay">30</td><td class="pay">3&times;</td></tr>
        <tr><td>Top (20)</td><td class="pay">20</td><td class="pay">2&times;</td></tr>
        <tr><td>Bottom (20)</td><td class="pay">10</td><td class="pay">1&times;</td></tr>
        <tr><td>No ring</td><td class="pay">0</td><td class="pay">&mdash;</td></tr>
      </tbody>
    </table>

    <footer>Press Space to roll</footer>
  </main>

  <script src="../arcade-util.js"></script>
  <script src="../music.js"></script>
  <script src="skeeball.js"></script>
</body>
</html>
