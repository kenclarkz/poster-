<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reaction Game · Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../arcade.css" />
</head>
<body class="arcade">
  <button id="music-toggle" aria-label="Toggle arcade music">&#9834; MUSIC OFF</button>

  <main class="table">
    <h1 class="title">Reflex <span>Reaction</span></h1>

    <nav class="game-nav" aria-label="Games">
      <a href="../arcade.html">Arcade</a>
      <a href="../index.html">Blackjack</a>
      <a href="../roulette.html">Roulette</a>
    </nav>

    <div class="back-row">
      <a href="../arcade.html" class="btn ghost">← Back to Arcade</a>
    </div>

    <p id="message" class="message" aria-live="polite">Press Start, then wait for green and click fast</p>

    <section class="canvas-frame">
      <canvas id="game" width="520" height="300" role="img" aria-label="Reaction game panel"></canvas>
    </section>

    <div class="score-row">
      <div class="score-pill">Wager <strong id="bet">$10</strong></div>
      <div class="score-pill">Reaction <strong id="time" style="color:#39ff88">—</strong></div>
      <div class="score-pill">Bankroll <strong id="bankroll">$1,000</strong></div>
    </div>

    <section class="controls">
      <div class="panel">
        <button class="chip-btn" data-chip="5">5</button>
        <button class="chip-btn" data-chip="25">25</button>
        <button class="chip-btn" data-chip="100">100</button>
      </div>
      <div class="panel">
        <button id="start" class="btn primary">Start</button>
      </div>
    </section>

    <table class="paytable" aria-label="Reaction payouts">
      <thead><tr><th>Reaction time</th><th>Payout</th></tr></thead>
      <tbody>
        <tr><td>&lt; 200 ms</td><td class="pay">5&times;</td></tr>
        <tr><td>&lt; 300 ms</td><td class="pay">3&times;</td></tr>
        <tr><td>&lt; 450 ms</td><td class="pay">2&times;</td></tr>
        <tr><td>&lt; 700 ms</td><td class="pay">1&times;</td></tr>
        <tr><td>Too early / late</td><td class="pay">&mdash;</td></tr>
      </tbody>
    </table>

    <footer>Press Space to start / react</footer>
  </main>

  <script src="../arcade-util.js"></script>
  <script src="../music.js"></script>
  <script src="reaction.js"></script>
</body>
</html>
